# Blueprint do Render — cria o site e o banco de dados de uma vez.
# No Render: New + → "Blueprint" → conecte este repositório.
services:
  - type: web
    name: raiz-digital
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # o Render gera um segredo forte
      - key: ADMIN_EMAIL
        value: silvio.neto@estudante.cear.ufpb.br
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: REGISTRATION_CODE
        sync: false                  # defina depois, no painel, se quiser exigir código
      - key: DATABASE_URL
        fromDatabase:
          name: raiz-digital-db
          property: connectionString

databases:
  - name: raiz-digital-db
    plan: free
    databaseName: raiz_digital
