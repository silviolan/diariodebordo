# Blueprint do Render — cria o site (web service).
# O banco de dados NÃO é criado aqui: você define a variável DATABASE_URL
# com a string de conexão de um Postgres (Neon recomendado — veja o README).
# Motivo: o Render só permite 1 banco grátis por conta.
# No Render: New + → "Blueprint" → conecte este repositório.
services:
  - type: web
    name: raiz-digital
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # o Render gera um segredo forte
      - key: ADMIN_EMAIL
        value: silvio.neto@estudante.cear.ufpb.br
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: REGISTRATION_CODE
        sync: false                  # defina depois, no painel, se quiser exigir código
      # Cole a string de conexão do seu Postgres (Neon, Supabase, ou um
      # banco Postgres que você já tenha no Render). Defina no painel do Render.
      - key: DATABASE_URL
        sync: false
